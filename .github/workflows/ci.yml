name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Preview channel of the Visual Studio Build Tools, used to keep the MSVC
  # jobs on the latest preview toolset.
  VS_PREVIEW_BOOTSTRAPPER_URL: https://aka.ms/vs/insiders/vs_BuildTools.exe
  VS_PREVIEW_CHANNEL_URI: https://aka.ms/vs/insiders/channel
  VS_PREVIEW_INSTALL_PATH: C:\VisualStudioPreview

jobs:
  build-and-test:
    name: ${{ matrix.name }} (${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Clang
            os: ubuntu-latest
            preset: linux-clang
            config: debug
          - name: Linux Clang
            os: ubuntu-latest
            preset: linux-clang
            config: release
          - name: macOS Clang
            os: macos-latest
            preset: macos-clang
            config: debug
          - name: macOS Clang
            os: macos-latest
            preset: macos-clang
            config: release
          - name: Windows MSVC x64
            os: windows-latest
            preset: windows-msvc-x64
            config: debug
            arch: x64
          - name: Windows MSVC x64
            os: windows-latest
            preset: windows-msvc-x64
            config: release
            arch: x64
          - name: Windows MSVC ARM64
            os: windows-11-arm
            preset: windows-msvc-arm64
            config: debug
            arch: arm64
          - name: Windows MSVC ARM64
            os: windows-11-arm
            preset: windows-msvc-arm64
            config: release
            arch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ninja-build

      - name: Install Ninja
        if: runner.os == 'macOS'
        run: brew list ninja || brew install ninja

      - name: Update runner to the latest MSVC preview toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/Install-MsvcPreview.ps1
          -Architecture ${{ matrix.arch }}
          -InstallPath $env:VS_PREVIEW_INSTALL_PATH
          -BootstrapperUrl $env:VS_PREVIEW_BOOTSTRAPPER_URL
          -ChannelUri $env:VS_PREVIEW_CHANNEL_URI

      - name: Verify the MSVC preview toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Test-MsvcPreview.ps1 -InstallPath $env:VS_PREVIEW_INSTALL_PATH

      - name: Set up the MSVC developer environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/Enter-MsvcEnvironment.ps1
          -Architecture ${{ matrix.arch }}
          -InstallPath $env:VS_PREVIEW_INSTALL_PATH
          -GitHubEnvironment

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}-${{ matrix.config }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}-${{ matrix.config }}
